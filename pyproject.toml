[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "owl-graphrag"
version = "0.1.0"
description = "Ontology retrieval and graph navigation over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.1,<8",
  "mcp>=1.21,<2",
  "pydantic>=2.10,<3",
  "rank-bm25>=0.2.2,<0.3",
  "numpy>=2,<3",
  "qdrant-client>=1.15,<2",
  "httpx>=0.28,<1",
  "anyio>=4.6,<5",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
owl-inspect = "owl_rag.cli:main"
owl-mcp = "owl_rag.mcp_server:main"
knowledge-mcp = "owl_rag.knowledge_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pre-commit>=4.7,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/owl_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
